name: One-shot live download control patcher

on:
  push:
    branches:
      - feat/android-daily-driver

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/android-daily-driver
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Patch Tauri and React download controls
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          lib_path = Path("src-tauri/src/lib.rs")
          lib = lib_path.read_text()
          lib = replace_once(
              lib,
              "use lumina_core::{",
              "mod download_control;\n\nuse download_control::ControlledDownload;\nuse lumina_core::{",
              "lib module import",
          )

          old_commands = '''#[tauri::command]
          fn remove_download_task(state: State<'_, AppState>, task_id: String) -> Result<bool, String> {
              state
                  .store
                  .remove_download_task(&task_id)
                  .map_err(|error| error.to_string())
          }

          #[tauri::command]
          async fn resolver_policy'''
          new_commands = '''#[tauri::command]
          fn remove_download_task(state: State<'_, AppState>, task_id: String) -> Result<bool, String> {
              state
                  .store
                  .remove_download_task(&task_id)
                  .map_err(|error| error.to_string())
          }

          #[tauri::command]
          async fn pause_download(state: State<'_, AppState>, task_id: String) -> Result<bool, String> {
              let accepted = download_control::pause(&task_id).await;
              if accepted {
                  if let Some(task) = state
                      .store
                      .list_download_tasks()
                      .map_err(|error| error.to_string())?
                      .into_iter()
                      .find(|task| task.id == task_id)
                  {
                      state
                          .store
                          .update_download_task(
                              &task_id,
                              DownloadState::Paused,
                              task.downloaded_bytes,
                              task.total_bytes,
                              None,
                          )
                          .map_err(|error| error.to_string())?;
                  }
              }
              Ok(accepted)
          }

          #[tauri::command]
          async fn cancel_download(state: State<'_, AppState>, task_id: String) -> Result<bool, String> {
              let accepted = download_control::cancel(&task_id).await;
              if accepted {
                  if let Some(task) = state
                      .store
                      .list_download_tasks()
                      .map_err(|error| error.to_string())?
                      .into_iter()
                      .find(|task| task.id == task_id)
                  {
                      state
                          .store
                          .update_download_task(
                              &task_id,
                              DownloadState::Cancelled,
                              task.downloaded_bytes,
                              task.total_bytes,
                              None,
                          )
                          .map_err(|error| error.to_string())?;
                  }
              }
              Ok(accepted)
          }

          #[tauri::command]
          async fn resolver_policy'''
          lib = replace_once(lib, old_commands, new_commands, "download control commands")

          old_result = '''    let result = downloader
                  .download_to_with_context(
                      url,
                      destination.clone(),
                      headers,
                      Some(format!("{provider_id}:{book_id}")),
                      tx,
                  )
                  .await;
              let _ = monitor.await;

              if let Err(error) = result {
                  let message = error.to_string();
                  let latest = state
                      .store
                      .list_download_tasks()
                      .ok()
                      .and_then(|tasks| tasks.into_iter().find(|task| task.id == task_id));
                  let downloaded = latest
                      .as_ref()
                      .map_or(resume_downloaded, |task| task.downloaded_bytes);
                  let total = latest
                      .as_ref()
                      .and_then(|task| task.total_bytes)
                      .or(resume_total);
                  let _ = state.store.update_download_task(
                      &task_id,
                      DownloadState::Failed,
                      downloaded,
                      total,
                      Some(&message),
                  );
                  return Err(message);
              }
          '''
          new_result = '''    let result = download_control::run_controlled(
                  task_id.clone(),
                  downloader.download_to_with_context(
                      url,
                      destination.clone(),
                      headers,
                      Some(format!("{provider_id}:{book_id}")),
                      tx,
                  ),
              )
              .await;
              let _ = monitor.await;

              let latest = state
                  .store
                  .list_download_tasks()
                  .ok()
                  .and_then(|tasks| tasks.into_iter().find(|task| task.id == task_id));
              let downloaded = latest
                  .as_ref()
                  .map_or(resume_downloaded, |task| task.downloaded_bytes);
              let total = latest
                  .as_ref()
                  .and_then(|task| task.total_bytes)
                  .or(resume_total);

              match result {
                  ControlledDownload::Paused => {
                      state
                          .store
                          .update_download_task(
                              &task_id,
                              DownloadState::Paused,
                              downloaded,
                              total,
                              None,
                          )
                          .map_err(|error| error.to_string())?;
                      return Err("__LUMINA_PAUSED__".to_string());
                  }
                  ControlledDownload::Cancelled => {
                      state
                          .store
                          .update_download_task(
                              &task_id,
                              DownloadState::Cancelled,
                              downloaded,
                              total,
                              None,
                          )
                          .map_err(|error| error.to_string())?;
                      return Err("__LUMINA_CANCELLED__".to_string());
                  }
                  ControlledDownload::AlreadyActive => {
                      return Err("download task is already active".to_string());
                  }
                  ControlledDownload::Finished(Err(error)) => {
                      let message = error.to_string();
                      let _ = state.store.update_download_task(
                          &task_id,
                          DownloadState::Failed,
                          downloaded,
                          total,
                          Some(&message),
                      );
                      return Err(message);
                  }
                  ControlledDownload::Finished(Ok(())) => {}
              }
          '''
          lib = replace_once(lib, old_result, new_result, "controlled download result")

          lib = replace_once(
              lib,
              "            remove_download_task,\n            resolver_policy,",
              "            remove_download_task,\n            pause_download,\n            cancel_download,\n            resolver_policy,",
              "invoke handler controls",
          )
          lib_path.write_text(lib)

          app_path = Path("src/App.tsx")
          app = app_path.read_text()

          old_status = '''  function handleZlibraryStatus(next: ZLibraryAccountStatus) {
              setZlibraryStatus(next);
              if (!next.signedIn && selectedProvider === "zlibrary") {
                setSearchResult(null);
                setSelectedBook(null);
                setBookDetails(null);
              }
            }

            async function runSearch'''
          new_status = '''  function handleZlibraryStatus(next: ZLibraryAccountStatus) {
              setZlibraryStatus(next);
              if (!next.signedIn && selectedProvider === "zlibrary") {
                setSearchResult(null);
                setSelectedBook(null);
                setBookDetails(null);
              }
            }

            async function refreshDownloads() {
              const persisted = await invoke<PersistedDownloadTask[]>("download_tasks");
              setDownloads(restoreDownloads(persisted));
            }

            async function runSearch'''
          app = replace_once(app, old_status, new_status, "refresh downloads helper")

          old_catch = '''    } catch (reason) {
              setDownloads((current) => ({
                ...current,
                [key]: {
                  ...current[key],
                  key,
                  providerId,
                  bookId,
                  title,
                  format,
                  state: "failed",
                  downloadedBytes: current[key]?.downloadedBytes ?? 0,
                  error: String(reason),
                },
              }));
              setError(String(reason));
            }
          '''
          new_catch = '''    } catch (reason) {
              const message = String(reason);
              try {
                await refreshDownloads();
              } catch (refreshReason) {
                setError(`${message} · 队列刷新失败：${String(refreshReason)}`);
                return;
              }
              if (message.includes("__LUMINA_PAUSED__") || message.includes("__LUMINA_CANCELLED__")) {
                return;
              }
              setError(message);
            }
          '''
          app = replace_once(app, old_catch, new_catch, "queue download catch")

          old_retry = '''  async function retryDownload(task: DownloadTask) {
              await queueDownload(task.providerId, task.bookId, task.title, task.format);
            }

            async function removeDownload'''
          new_retry = '''  async function retryDownload(task: DownloadTask) {
              await queueDownload(task.providerId, task.bookId, task.title, task.format);
            }

            async function pauseDownload(task: DownloadTask) {
              try {
                const accepted = await invoke<boolean>("pause_download", { taskId: task.key });
                if (!accepted) {
                  await refreshDownloads();
                  return;
                }
                setDownloads((current) => ({
                  ...current,
                  [task.key]: { ...current[task.key], state: "paused" },
                }));
              } catch (reason) {
                setError(String(reason));
              }
            }

            async function cancelDownload(task: DownloadTask) {
              try {
                const accepted = await invoke<boolean>("cancel_download", { taskId: task.key });
                if (!accepted) {
                  await refreshDownloads();
                  return;
                }
                setDownloads((current) => ({
                  ...current,
                  [task.key]: { ...current[task.key], state: "cancelled" },
                }));
              } catch (reason) {
                setError(String(reason));
              }
            }

            async function removeDownload'''
          app = replace_once(app, old_retry, new_retry, "pause cancel UI functions")

          old_actions = '''                  <div className="download-actions">
                              {canResume ? <button className="primary-button small" onClick={() => void retryDownload(task)}>继续</button> : null}
                              {!isActive ? <button className="ghost-button" onClick={() => void removeDownload(task)}>移除记录</button> : null}
                            </div>'''
          new_actions = '''                  <div className="download-actions">
                              {task.state === "downloading" ? <button className="ghost-button" onClick={() => void pauseDownload(task)}>暂停</button> : null}
                              {task.state === "downloading" ? <button className="ghost-button danger" onClick={() => void cancelDownload(task)}>取消</button> : null}
                              {canResume ? <button className="primary-button small" onClick={() => void retryDownload(task)}>继续</button> : null}
                              {!isActive ? <button className="ghost-button" onClick={() => void removeDownload(task)}>移除记录</button> : null}
                            </div>'''
          app = replace_once(app, old_actions, new_actions, "download action buttons")
          app_path.write_text(app)
          PY
          cargo fmt --all
      - name: Commit live transfer controls
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/lib.rs src/App.tsx
          git commit -m "feat: add live pause and cancel controls"
          git push origin HEAD:feat/android-daily-driver
