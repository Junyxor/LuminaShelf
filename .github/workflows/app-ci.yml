name: App CI

on:
  push:
    branches: [main, "feat/usable-release"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        run: npm ci
      - name: Test app workflows
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Check Tauri formatting
        run: cargo fmt -p lumina-shelf-desktop -- --check
      - name: Check Tauri bridge
        run: cargo check --locked -p lumina-shelf-desktop
      - name: Test Tauri bridge
        run: cargo test --locked -p lumina-shelf-desktop --lib
