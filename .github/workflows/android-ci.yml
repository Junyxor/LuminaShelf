name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: Publish the built APK as a GitHub prerelease
        required: false
        type: boolean
        default: false
      tag:
        description: Prerelease tag
        required: false
        default: v0.5.0-alpha.1

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm install

      - name: Initialize Android project
        run: npm run tauri -- android init --ci

      - name: Resolve Android NDK
        shell: bash
        run: |
          NDK_HOME="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -n "$NDK_HOME"
          test -d "$NDK_HOME/toolchains/llvm"
          echo "Using Android NDK: $NDK_HOME"
          echo "NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"

      - name: Build arm64 debug APK
        run: npm run tauri -- android build --debug --apk --target aarch64

      - name: Stage APK
        shell: bash
        run: |
          APK="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -f "$APK"
          cp "$APK" LuminaShelf-arm64-v8a-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuminaShelf-android-arm64-debug
          path: LuminaShelf-arm64-v8a-debug.apk
          if-no-files-found: error

      - name: Publish GitHub prerelease
        if: github.event_name == 'workflow_dispatch' && inputs.publish_prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" LuminaShelf-arm64-v8a-debug.apk \
            --target "$GITHUB_SHA" \
            --title "LuminaShelf ${RELEASE_TAG}" \
            --notes "Early Android arm64 test build. This prerelease is intended for installation and real-device testing." \
            --prerelease
