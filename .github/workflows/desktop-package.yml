name: Desktop Package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/desktop-package.yml"
      - "src-tauri/tauri.conf.json"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm install

      - name: Generate desktop icon set
        shell: pwsh
        run: |
          Copy-Item "src-tauri/icons/icon.png" "app-icon.png"
          npm run tauri -- icon app-icon.png

      - name: Build Windows NSIS installer
        run: npm run tauri -- build --bundles nsis

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuminaShelf-windows-x64
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem "target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced" }
          gh release create "${{ github.ref_name }}" "$($installer.FullName)" --title "LuminaShelf ${{ github.ref_name }}" --generate-notes
