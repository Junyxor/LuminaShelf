name: Desktop Package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/desktop-package.yml"
      - "src-tauri/**"
      - "crates/**"
      - "src/**"
      - "scripts/smoke-desktop.mjs"
      - "package*.json"
      - "Cargo.*"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate desktop icon set
        shell: pwsh
        run: |
          Copy-Item "src-tauri/icons/icon.png" "app-icon.png"
          npm run tauri -- icon app-icon.png

      - name: Build and smoke test Windows app
        run: |
          npm run tauri -- build --debug --no-bundle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LuminaShelf-windows-smoke
          path: artifacts/smoke/

      - name: Build Windows NSIS installer
        run: npm run tauri -- build --bundles nsis

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuminaShelf-windows-x64
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem "target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced" }
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "${{ github.ref_name }}" "$($installer.FullName)" --clobber
          } else {
            gh release create "${{ github.ref_name }}" "$($installer.FullName)" --title "LuminaShelf ${{ github.ref_name }}" --generate-notes
          }
