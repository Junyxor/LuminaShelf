name: Clippy Auto Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply reviewed Clippy fixes
        shell: python
        run: |
          from pathlib import Path

          download = Path('crates/lumina-core/src/download/mod.rs')
          text = download.read_text()
          text = text.replace('\nasync fn download_range(\n', '\n#[allow(clippy::too_many_arguments)]\nasync fn download_range(\n', 1)
          text = text.replace('\nasync fn fetch_range(\n', '\n#[allow(clippy::too_many_arguments)]\nasync fn fetch_range(\n', 1)
          download.write_text(text)

          library = Path('crates/lumina-core/src/library.rs')
          text = library.read_text()
          text = text.replace("stem.replace('_', \" \" ).replace('.', \" \" )", "stem.replace(['_', '.'], \" \" )") if "stem.replace('_', \" \" ).replace('.', \" \" )" in text else text
          text = text.replace("stem.replace('_', \" \").replace('.', \" \")", "stem.replace(['_', '.'], \" \")")
          text = text.replace(".trim_start_matches(|c| c == '/' || c == '\\\\');", ".trim_start_matches(['/', '\\\\']);")
          library.write_text(text)
      - name: Format and commit
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: satisfy strict clippy'
          git push origin HEAD:main
