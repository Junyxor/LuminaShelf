name: Rust Core CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -p lumina-core -- --check
      - run: cargo test --locked -p lumina-core
      - run: cargo clippy --locked -p lumina-core --all-targets -- -D warnings
